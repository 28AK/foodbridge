[theme]
base = "light"
primaryColor = "#2E7D32"
backgroundColor = "#F8FBF6"
secondaryBackgroundColor = "#EEF5EA"
textColor = "#1F2A1F"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

[server]
maxUploadSize = 8   # MB, matches the API limit

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
