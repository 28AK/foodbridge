[theme]
base = "light"
primaryColor = "#3E6650"
backgroundColor = "#FAF6F0"
secondaryBackgroundColor = "#F1ECE3"
textColor = "#24332B"
font = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"

[server]
maxUploadSize = 8   # MB, matches the API limit

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
