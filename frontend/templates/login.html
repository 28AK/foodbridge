{% extends "base.html" %}
{% block title %}Log in · FoodBridge{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<div class="card">
  <h2>Log in</h2>
  <form id="login-form" class="form">
    <label>Email <input type="email" name="username" required autocomplete="email"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <p class="error" id="error" hidden></p>
    <button class="btn" type="submit">Log in</button>
  </form>
  <p class="small">New here? <a href="/register">Create an account</a></p>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', path='js/auth.js') }}"></script>
{% endblock %}
